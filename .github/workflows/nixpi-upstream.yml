name: NixPi Upstream-Check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: nixpi/main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Upstream abgleichen (read-only)
        run: |
          git remote add upstream https://github.com/earendil-works/pi.git
          scripts/nixpi-upstream-sync.sh --check | tee -a "$GITHUB_STEP_SUMMARY"
