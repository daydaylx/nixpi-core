name: NixPi CI

on:
  push:
    branches: [nixpi/main, integration/upstream]
  pull_request:
    branches: [nixpi/main]

concurrency:
  group: nixpi-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - name: NixPi- und angepasste Upstream-Tests
        working-directory: packages/coding-agent
        run: npx vitest --run
      - name: Upstream-Identitätstests unter Pi-Identität
        working-directory: packages/coding-agent
        run: npm run test:identity
      - name: Binary-Smoke
        run: |
          node packages/coding-agent/dist/bundle/cli.js version
          HOME=$(mktemp -d) node packages/coding-agent/dist/bundle/cli.js recover | head -5
